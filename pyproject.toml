[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "youtube-medialoader"
version = "v2.2-stable"
description = "Десктопное приложение для скачивания видео и аудио с YouTube"
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "MindlessMuse666"},
]
requires-python = ">=3.12"
keywords = ["youtube", "downloader", "pyside6", "yt-dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: AGPL-3.0 License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "PySide6>=6.11",
    "yt-dlp>=2024",
]

[project.urls]
"Homepage" = "https://github.com/MindlessMuse666/youtube-medialoader"
"Bug Tracker" = "https://github.com/MindlessMuse666/youtube-medialoader/issues"

[project.scripts]
youtube-medialoader = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.ttf", "*.otf", "*.ico", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
